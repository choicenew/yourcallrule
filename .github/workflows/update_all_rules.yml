name: Sync All Rules & Update Delta Setup Config

on:
  push:
    branches:
      - main
  schedule:
    # 最佳空闲运行时间: 07:37 UTC (非整点 :37 规避 Actions 队列拥堵)
    - cron: '37 7 * * *'
  workflow_dispatch:

jobs:
  sync_and_generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas phonenumbers pyyaml requests

      - name: Fetch China vCards (CN 19 Categories)
        run: |
          python scripts/fetchers/fetch_cn_vcards.py

      - name: Fetch US Official Data (FTC & FCC CSV)
        run: |
          python scripts/fetchers/fetch_us_official.py

      - name: Fetch US FTC DNC API Complaints
        run: |
          python scripts/fetchers/fetch_ftc_api.py

      - name: Fetch US FCC Unwanted Calls API
        run: |
          python scripts/fetchers/fetch_fcc_api.py

      - name: Fetch US ToastedSpam Blocklist
        run: |
          python scripts/fetchers/fetch_toastedspam.py

      - name: Fetch France BegoneFR Regex
        run: |
          python scripts/fetchers/fetch_begone_fr.py

      - name: Fetch France Saracroche ARCEP Operators API
        run: |
          python scripts/fetchers/fetch_saracroche.py

      - name: Fetch Turkish Spam Numbers
        run: |
          python scripts/fetchers/fetch_turkish_spam.py

      - name: Fetch OpenCallShield (Colombia)
        run: |
          python scripts/fetchers/fetch_opencallshield.py

      - name: Fetch SpamChile (Chile)
        run: |
          python scripts/fetchers/fetch_spamchile.py

      - name: Fetch Lista Hũ (Paraguay API)
        run: |
          python scripts/fetchers/fetch_listahu.py

      - name: Fetch PhoneBlock.net (Europe API)
        run: |
          python scripts/fetchers/fetch_phoneblock.py

      - name: Fetch CallShield Approved Global List
        run: |
          python scripts/fetchers/fetch_callshield_approved.py

      - name: Fetch CallShield Shards Global List
        run: |
          python scripts/fetchers/fetch_callshield_shards.py

      - name: Generate Regulatory Regex Rules
        run: |
          python scripts/generators/generate_regulatory_regex.py

      - name: Generate CallShield Community Hot List
        run: |
          python scripts/generators/generate_hot_list.py

      - name: Merge, Deduplicate and Update Config
        run: |
          python scripts/mergers/merge_and_deduplicate.py

      - name: Generate Plugin Setup Config (JS Plugins)
        run: |
          python scripts/generators/generate_plugin_config.py

      - name: Commit and Push Updated Rules & Config
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto sync rulesets, plugins and update setup configs [skip ci]"
          file_pattern: "CN/ US/ FR/ TR/ IN/ CO/ CL/ PY/ EU/ callshield/ merged_rules/ app_delta_setup_config.json app_plugin_setup_config.json"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          push_options: '--force'
