name: Auto Update CallShield Subscriptions

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Clone upstream CallShield
        run: |
          git clone --depth 1 https://github.com/SysAdminDoc/CallShield.git CallShield

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run CallShield conversion script
        run: |
          python callshield/scripts/convert_callshield.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(callshield): auto update callshield blocklist subscriptions [skip ci]"
          file_pattern: "callshield/"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          push_options: '--force'
          repository: .
