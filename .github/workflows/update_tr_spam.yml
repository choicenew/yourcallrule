name: Sync Turkish Spam Numbers (TR)

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch:

jobs:
  process_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas

      - name: Download and Process Turkish Spam Numbers
        run: python scripts/fetchers/fetch_turkish_spam.py

      - name: Commit and Push CSV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(tr): update Turkish spam numbers database"
          file_pattern: "TR/*.csv"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          push_options: '--force'
