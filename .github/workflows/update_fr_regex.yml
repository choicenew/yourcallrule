name: Sync France Regex Rules (FR)

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 1 * * 3'
  workflow_dispatch:

jobs:
  process_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas

      - name: Download BegoneFR and Generate CSV
        run: python scripts/fetchers/fetch_begone_fr.py

      - name: Commit Processed CSV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(fr): update France regex block patterns"
          file_pattern: "FR/*.csv"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          push_options: '--force'
