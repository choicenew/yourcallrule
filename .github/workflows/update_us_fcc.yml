name: Sync US FCC Data

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  process_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas phonenumbers

      - name: Download and Process US Official Data
        run: python scripts/fetch_us_official.py

      - name: Commit Processed CSV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(us): update US FCC telecom database"
          file_pattern: "US/fcc_processed_data.csv"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          push_options: '--force'
