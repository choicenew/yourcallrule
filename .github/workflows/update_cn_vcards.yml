name: Sync China vCard Data (CN)

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 */30 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pyyaml requests

      - name: Fetch and Clean China vCards
        run: python scripts/fetch_cn_vcards.py

      - name: Commit Final CSVs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(cn): 自动解包并更新中国地区官方号码 (CN/*.csv)"
          file_pattern: "CN/*.csv"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          push_options: '--force'
